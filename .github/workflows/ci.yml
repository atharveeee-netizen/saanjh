name: SAANJH CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    name: Python analyses, contracts and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate result contracts and gateway summaries
        run: python -m simulation.contracts

      - name: Run test suite (includes headless dashboard render)
        run: pytest -q

      - name: Check that docs match results.json
        run: python scripts/render_results.py --check

      - name: Regenerate replay evidence and re-validate
        run: |
          python -m gateway.service --mode replay --nodes 3 --hours 6 \
            --duration-min 45 --packet-loss 0.02
          python -m simulation.contracts

  firmware:
    name: RAK4631 firmware build and native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/rak4631_node/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build all three node images
        working-directory: firmware/rak4631_node
        run: pio run -e node101 -e node102 -e node103

      - name: Run native protocol, controller and battery tests
        working-directory: firmware/rak4631_node
        run: pio test -e native

  quickstart:
    name: Fresh-clone quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the documented one-command check
        run: python scripts/run_all.py --quick
