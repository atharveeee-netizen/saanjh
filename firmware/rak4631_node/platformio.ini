; SAANJH RAK4631 node firmware
;
; Build one image per physical node:
;   pio run -e node101 -t upload
;   pio run -e node102 -t upload
;   pio run -e node103 -t upload
;
; Native protocol/controller tests (no hardware):
;   pio test -e native

[platformio]
default_envs = node101

[env]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
board_build.variants_dir = variants
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    jgromes/RadioLib@7.1.2
build_unflags =
    -Os
build_flags =
    -O2
    -Wall
    -DSAANJH_RESERVE_PCT=70.0
    -DSAANJH_TELEMETRY_MS=10000
    -DSAANJH_BATTERY_CAPACITY_WH=76.8

[env:node101]
build_flags = ${env.build_flags} -DSAANJH_NODE_ID=101

[env:node102]
build_flags = ${env.build_flags} -DSAANJH_NODE_ID=102

[env:node103]
build_flags = ${env.build_flags} -DSAANJH_NODE_ID=103

[env:native]
platform = native
test_framework = unity
framework =
test_build_src = yes
build_src_filter =
    +<saanjh_protocol.cpp>
    +<node_controller.cpp>
    +<battery.cpp>
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall
