<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAANJH | Grid Control Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 27, 34, 0.7);
            --accent-green: #3DCD58;
            --accent-red: #ff4d4d;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
        }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); }
        header { background: rgba(11, 15, 25, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        header h1 span { color: var(--accent-green); }
        .dashboard { padding: 2rem; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }
        .kpi-container { grid-column: span 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        .kpi-card { background: var(--panel-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 1.5rem; border-top: 3px solid var(--accent-green); }
        .kpi-card.alert { border-top: 3px solid var(--accent-red); }
        .kpi-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem; }
        .kpi-value { font-size: 2.2rem; font-weight: 700; margin: 0; }
        .kpi-subtext { font-size: 0.85rem; color: var(--accent-green); margin-top: 0.5rem; }
        .chart-section { grid-column: span 3; background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; }
    </style>
</head>
<body>
    <header>
        <h1>⚡ SAANJH <span>Grid Control Centre</span></h1>
    </header>
    <div class="dashboard">
        <div class="kpi-container">
            <div class="kpi-card">
                <div class="kpi-label">SAANJH Peak Load</div>
                <p class="kpi-value" id="kpi-peak">Loading...</p>
                <div class="kpi-subtext" id="kpi-reduction"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Active Flexibility</div>
                <p class="kpi-value" id="kpi-flex" style="color:var(--accent-green)">Loading...</p>
                <div class="kpi-subtext" id="kpi-homes"></div>
            </div>
            <div class="kpi-card alert">
                <div class="kpi-label">DT Overload Duration</div>
                <p class="kpi-value" id="kpi-overload">Loading...</p>
                <div class="kpi-subtext" id="kpi-overload-red" style="color:var(--accent-red)"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Cost Efficiency</div>
                <p class="kpi-value" id="kpi-cost">Loading...</p>
                <div class="kpi-subtext">Per Dependable kW</div>
            </div>
        </div>
        <div class="chart-section">
            <h2>Transformer Load Profile (Simulation Output)</h2>
            <canvas id="loadChart" height="300"></canvas>
        </div>
    </div>

    <script>
        // STRICT RULE ENFORCEMENT: No hardcoded data. 
        // We fetch the actual output generated by simulation/feeder_sim.py
        
        async function loadSimulationData() {
            try {
                // Fetch KPIs JSON
                const kpiRes = await fetch('../simulation/data/results/comparison.json');
                const kpiData = await kpiRes.json();
                
                // Update DOM KPIs
                document.getElementById('kpi-peak').innerText = kpiData.saanjh_peak_kw.toFixed(1) + ' kW';
                document.getElementById('kpi-reduction').innerText = `↓ ${kpiData.peak_reduction_pct.toFixed(1)}% below baseline`;
                document.getElementById('kpi-flex').innerText = kpiData.peak_reduction_kw.toFixed(1) + ' kW';
                document.getElementById('kpi-homes').innerText = `From ${kpiData.homes_participating} participating homes`;
                document.getElementById('kpi-overload').innerText = kpiData.saanjh_overload_minutes + ' min';
                document.getElementById('kpi-overload-red').innerText = `Down from ${kpiData.baseline_overload_minutes} mins`;
                document.getElementById('kpi-cost').innerText = '₹' + kpiData.cost_per_dependable_kw;

                // Fetch Baseline CSV
                const baseRes = await fetch('../simulation/data/results/baseline_profile.csv');
                const baseText = await baseRes.text();
                const baseCsv = Papa.parse(baseText, {header: true, dynamicTyping: true}).data.filter(d => d.time_min != null);

                // Fetch SAANJH CSV
                const saanjhRes = await fetch('../simulation/data/results/saanjh_profile.csv');
                const saanjhText = await saanjhRes.text();
                const saanjhCsv = Papa.parse(saanjhText, {header: true, dynamicTyping: true}).data.filter(d => d.time_min != null);

                // Filter for evening peak (16:00 to 22:00 -> min 960 to 1320)
                const startIndex = baseCsv.findIndex(d => d.time_min >= 960);
                const endIndex = baseCsv.findIndex(d => d.time_min >= 1320);
                
                const plotBase = baseCsv.slice(startIndex, endIndex);
                const plotSaanjh = saanjhCsv.slice(startIndex, endIndex);

                const labels = plotBase.map(d => {
                    let h = Math.floor(d.time_min / 60);
                    let m = d.time_min % 60;
                    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
                });

                const baseLoad = plotBase.map(d => d.total_load_kw);
                const saanjhLoad = plotSaanjh.map(d => d.total_load_kw);
                const transformerLimit = plotBase.map(d => 80.75); // 100kVA * 0.85 * 0.95

                renderChart(labels, baseLoad, saanjhLoad, transformerLimit);

            } catch (error) {
                console.error("Error loading simulation data. Ensure you are serving via a web server.", error);
                document.getElementById('kpi-peak').innerText = "ERROR";
            }
        }

        function renderChart(labels, baseLoad, saanjhLoad, limit) {
            const ctx = document.getElementById('loadChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Unmanaged Load (Baseline)', data: baseLoad, borderColor: '#ff4d4d', backgroundColor: 'rgba(255, 77, 77, 0.1)', borderWidth: 2, fill: true, tension: 0.1, borderDash: [5, 5] },
                        { label: 'SAANJH Managed Load', data: saanjhLoad, borderColor: '#3DCD58', backgroundColor: 'rgba(61, 205, 88, 0.2)', borderWidth: 3, fill: true, tension: 0.1 },
                        { label: 'Transformer Safe Limit (80.75 kW)', data: limit, borderColor: '#A0AEC0', borderWidth: 1, pointRadius: 0, borderDash: [10, 5], fill: false }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e6edf3' } } },
                    scales: {
                        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#8b949e' }, title: { display: true, text: 'Load (kW)', color: '#8b949e' } },
                        x: { grid: { display: false }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        loadSimulationData();
    </script>
</body>
</html>
