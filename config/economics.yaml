# Economics inputs. Every value has [low, base, high] and a note.
#   [SOURCE: ...]  from a cited source (docs/PROJECT_BRIEF.md)
#   [MEASURED]     the earlier prototype bill of materials (archive/)
#   [ASSUMPTION]   engineering or market assumption; varied in the tornado analysis
# Rupees (INR) unless stated. Simulation outputs (energy, hours, cycles) are not set here;
# they are read from simulation/results/results.json.

general:
  discount_rate:        {low: 0.08, base: 0.10, high: 0.12, note: "[ASSUMPTION] real discount rate"}
  horizon_years:        {low: 10, base: 10, high: 10, note: "[ASSUMPTION] appraisal period"}

hardware:
  smart_meter_load_limit_per_home: {low: 0, base: 0, high: 300, note: "[SOURCE: RDSS smart meters already installed; ASSUMPTION that the head-end supports load limiting, high case covers a firmware/configuration charge]"}
  head_end_integration_per_dt:     {low: 20000, base: 50000, high: 100000, note: "[ASSUMPTION] one-time integration of SAANJH with the DISCOM head-end/MDM, shared per DT"}
  relay_node:                      {low: 1500, base: 2500, high: 4000, note: "[ASSUMPTION] LoRa node + normally-closed relay + enclosure at volume; the hand-built prototype node cost Rs 7,073 [MEASURED]"}
  appliance_actuator:              {low: 800, base: 1500, high: 2500, note: "[ASSUMPTION] smart plug or contactor"}
  dt_gateway:                      {low: 12000, base: 22420, high: 30000, note: "[MEASURED] base is the prototype CM4 + LoRa HAT bill of materials"}
  lfp_new_pack_per_kwh:            {low: 10000, base: 12000, high: 15000, note: "[ASSUMPTION] new LFP pack price, India 2026"}
  second_life_share_of_new:        {low: 0.40, base: 0.55, high: 0.70, note: "[SOURCE: brief, 40-70% of new LFP pack cost]"}
  repurposing_bms_per_kwh:         {low: 1000, base: 1500, high: 2500, note: "[ASSUMPTION] testing, regrouping and a new BMS"}
  pcs_per_kw:                      {low: 8000, base: 10000, high: 15000, note: "[ASSUMPTION] bidirectional inverter / PCS"}
  enclosure_fire_safety:           {low: 150000, base: 250000, high: 400000, note: "[ASSUMPTION] outdoor enclosure, thermal monitoring, aerosol suppression"}
  battery_installation_civil:      {low: 100000, base: 150000, high: 250000, note: "[ASSUMPTION] plinth, cabling, protection, commissioning"}

tariffs:
  residential_tariff_per_kwh:      {low: 5.5, base: 6.5, high: 7.5, note: "[ASSUMPTION] average residential energy charge"}
  tod_peak_premium:                {low: 0.10, base: 0.15, high: 0.20, note: "[SOURCE: brief, ToD peak 10-20% dearer]"}
  tod_solar_discount:              {low: 0.10, base: 0.15, high: 0.20, note: "[SOURCE: brief, solar hours 10-20% cheaper]"}
  peak_power_purchase_per_kwh:     {low: 8.0, base: 10.0, high: 12.0, note: "[ASSUMPTION] DISCOM marginal evening purchase price (exchange evening blocks)"}
  solar_hours_purchase_per_kwh:    {low: 3.0, base: 3.5, high: 4.5, note: "[ASSUMPTION] DISCOM marginal purchase price in solar hours"}

value_streams:
  dfpo_value_per_kw_month:         {low: 100, base: 200, high: 400, note: "[ASSUMPTION] value of flexibility counted toward the Demand Flexibility Portfolio Obligation"}
  dt_augmentation_cost:            {low: 300000, base: 450000, high: 600000, note: "[ASSUMPTION] replacing a 100 kVA DT with a larger one; counted only if the baseline DT overloads"}
  voll_per_kwh:                    # [ASSUMPTION] societal value of lost load, by segment (not a DISCOM cash flow)
    low_income: {low: 15, base: 25, high: 40, note: "[ASSUMPTION]"}
    middle:     {low: 25, base: 40, high: 60, note: "[ASSUMPTION]"}
    affluent:   {low: 40, base: 60, high: 90, note: "[ASSUMPTION]"}

household_battery:
  battery_price:                   {low: 11000, base: 13500, high: 16000, note: "[ASSUMPTION] 150 Ah tubular lead-acid"}
  cycle_life_at_shallow_dod:       {low: 1200, base: 1800, high: 2500, note: "[ASSUMPTION] cycles to end of life at ~30% depth of discharge"}
  compensation_margin:             {low: 1.1, base: 1.2, high: 1.3, note: "[ASSUMPTION] compensation as a multiple of wear + charging-loss cost"}

operations:
  local_operator_fee_per_month:    {low: 3000, base: 4500, high: 6000, note: "[ASSUMPTION] part-time RWA/SHG operator per DT"}
  technician_visits_per_year:      {low: 4, base: 6, high: 12, note: "[ASSUMPTION] per DT"}
  technician_visit_cost:           {low: 800, base: 1200, high: 2000, note: "[ASSUMPTION]"}
  node_maintenance_share:          {low: 0.03, base: 0.05, high: 0.08, note: "[ASSUMPTION] of node/actuator/gateway capex per year"}
  battery_om_share:                {low: 0.01, base: 0.02, high: 0.03, note: "[ASSUMPTION] of battery capex per year"}
  communications_per_year:         {low: 2400, base: 3600, high: 6000, note: "[ASSUMPTION] gateway backhaul SIM"}
  battery_end_of_life_capacity:    {low: 0.6, base: 0.6, high: 0.6, note: "[ASSUMPTION] second-life pack retired at 60% of its starting capacity"}
  battery_calendar_life_years:     {low: 6, base: 8, high: 10, note: "[ASSUMPTION] second-life pack calendar limit"}

benchmarks:
  utility_bess_per_kw:             {low: 30000, base: 40000, high: 50000, note: "[ASSUMPTION] new utility-scale 2-hour BESS installed cost per kW"}
  home_inverter_kit:               {low: 15000, base: 19500, high: 25000, note: "[ASSUMPTION] a household's own inverter (~Rs 6,000) plus 150 Ah battery"}
  home_inverter_battery_life_years: {low: 4, base: 5, high: 6, note: "[ASSUMPTION] battery replacement interval"}
