# SAANJH configuration
#
# Every number carries a label:
#   [SOURCE: ...]  taken from a cited source (see docs/PROJECT_BRIEF.md, docs/DATA_SOURCES.md)
#   [ASSUMPTION]   engineering assumption, varied in sensitivity runs where it matters
#   [SIMULATED]    a modelling choice with no external basis

electrical:
  voltage_nominal_v: 230          # [SOURCE: IS 12360, LV single-phase nominal 230 V]
  voltage_low_limit_pu: 0.94      # [SOURCE: CEA Distribution Code, LV +/-6%]
  power_factor: 0.95              # [ASSUMPTION] residential aggregate
  lt_feeder:                      # [ASSUMPTION] lumped balanced 3-phase LT feeder equivalent
    r_ohm: 0.08
    x_ohm: 0.02
    s_nom_mva: 0.25

transformer:
  rating_kva: 100                 # [ASSUMPTION] typical urban DT size
  dispatch_target_pct: 95         # [ASSUMPTION] dispatcher keeps loading below this

simulation:
  step_min: 15                    # DISCOM scheduling resolution
  report_window_h: [16, 24]       # evening window used for peak-case reporting

inverter_battery:
  capacity_kwh: 1.8               # [ASSUMPTION] 150 Ah x 12 V lead-acid
  inverter_kw: 0.7                # [ASSUMPTION] ~900 VA home inverter
  initial_soc: 1.0                # [ASSUMPTION] battery on float charge is full while grid is present
  reserve_soc: 0.70               # household backup reserve that SAANJH never touches
  target_soc: 1.0                 # inverter recharges back to full
  round_trip_efficiency: 0.80     # [ASSUMPTION] lead-acid incl. inverter losses
  charge_kw: 0.2                  # [ASSUMPTION] ~15 A at 13.5 V charger
  outage_floor_soc: 0.20          # [ASSUMPTION] inverter low-battery cut-off during real outages
  release_stagger_steps: 2        # relays re-close spread over up to N steps after an event

appliance_flex:
  max_defer_min:                  # [ASSUMPTION] longest a deferred appliance may wait
    water_heater: 60
    water_pump: 90
    ev_charger: 120
  ac_setpoint_reduction: 0.10     # [ASSUMPTION] ~1 degC setpoint raise (JVVNL pilot style)
  ac_rebound_share: 0.5           # [ASSUMPTION] share of avoided AC energy that returns later
  rebound_stagger_steps: 4        # deferred appliances restart spread over up to N steps

participation:
  inverter_relay: 0.6             # [ASSUMPTION] share of inverter owners who enrol and get a relay node

grid:
  lt_feeders: 4                   # [ASSUMPTION] LT feeders ("ways") per DT; the baseline sheds at this granularity

essential_band:                   # smart-meter load limiting
  band_w: 500                     # default floor of the band (prompt default; sensitivity 300 / 1000)
  ladder_w: [1000, 750, 500]      # dispatcher uses the gentlest level that closes the gap
  critical_band_w: 1000           # homes flagged critical (medical device, enterprise fridge)
  grace_s: 30                     # [ASSUMPTION] meter trip delay; covers motor inrush

community_battery:                # second-life EV pack at the DT [ASSUMPTION sizes; varied in sensitivity]
  capacity_kwh: 100
  power_kw: 40
  round_trip_efficiency: 0.85
  soc_min: 0.10
  soc_max: 0.90
  initial_soc: 0.90
  fade_per_efc: 0.0002            # [ASSUMPTION] ~20% further fade over 1,000 equivalent full cycles
  derate_start_c: 40              # [ASSUMPTION] power derate above this ambient temperature
  derate_per_c: 0.03
  charge_window_h: [9, 16]        # solar hours, cheapest under Time-of-Day tariffs

dispatch:
  assumed_event_blocks: 8         # without a forecast, assume a deficit lasts 2 h when planning battery energy
  battery_mode: auto              # auto: full support if energy suffices for the event, else essential-only
  heatwave_cooling_multiplier: 1.15   # [ASSUMPTION] extra cooling load on heatwave days

forecast:
  model_path: artifacts/models/real_xgboost_model.pkl   # trained on UCI (non-Indian) data

site:                             # weather for PV and day types (REAL DATA, NASA POWER)
  name: lucknow
  year: 2023
  latitude: 26.85
  longitude: 80.95

# Baseline outage calibration. REAL DATA (published aggregates): Prayas (Energy Group),
# "ESMI in Uttar Pradesh", ESMI monitoring locations 2016-19. Used unless
# data/processed/esmi_stats.json (built from the raw ESMI files) is present.
outage_calibration:
  source: "Prayas (Energy Group), ESMI in Uttar Pradesh (blog series on ESMI data, 2016-19 locations)"
  url: https://energy.prayaspune.org/our-work/article-and-blog/esmi-in-uttar-pradesh
  categories:
    megacity:        {daily_outage_min: 21,  evening_outage_min: 12, outages_per_day: 2}
    other_municipal: {daily_outage_min: 90,  evening_outage_min: 53, outages_per_day: 5}
    rural:           {daily_outage_min: 240, evening_outage_min: 90, outages_per_day: 10}
  duration_mix: {under_1h: 0.30, one_to_3h: 0.33, over_3h: 0.37}
  evening_window_h: [17, 23]
  # Outages are more frequent toward the end of summer and least frequent in winter
  # (same source). Relative weights below are an [ASSUMPTION] encoding that statement.
  season_weight: {winter: 0.6, spring: 0.9, summer: 1.4, monsoon: 1.2, post_monsoon: 0.8}
  # [ASSUMPTION] share of evening outage minutes caused by supply shortfall (rationing /
  # load shedding) rather than faults. SAANJH only addresses shortfall outages.
  deficit_share: 0.5

# ---------------------------------------------------------------------------
# Household segments. Load shapes are piecewise (start_h, end_h, kW) profiles
# or sessions (start time distribution, duration, kW). Each home gets random
# jitter so homes are not identical.
# ---------------------------------------------------------------------------
segments:
  legacy:
    label: "SIMULATED: original prototype magnitudes, not calibrated to Indian data"
    ownership:
      inverter: 0.20              # [ASSUMPTION] replaces the earlier unsupported 70% figure
      rooftop_pv: 0.25
      actuator: 0.25              # smart plug / contactor / smart AC installed
    pv_kwp: 1.0
    appliances:
      lighting:     {own: 1.0, critical: true,  backed_up: true,  profile: [[0, 5, 0.02], [5, 7, 0.06], [17, 18, 0.05], [18, 23, 0.18], [23, 24, 0.04]]}
      fans:         {own: 1.0, critical: true,  backed_up: true,  profile: [[0, 24, 0.15]]}
      tv:           {own: 1.0, critical: true,  backed_up: true,  profile: [[18.5, 23, 0.12]]}
      fridge:       {own: 1.0, critical: true,  backed_up: false, profile: [[0, 24, 0.20]]}
      cooking:      {own: 1.0, critical: true,  backed_up: false, session: {start_mean: 18.75, start_sd: 0.25, duration_min: 60, kw: 0.65}}
      ac:           {own: 0.55, critical: false, flex: setpoint, session: {start_mean: 18.75, start_sd: 0.30, duration_min: 300, kw: 1.10}}
      water_heater: {own: 0.60, critical: false, flex: defer,    session: {start_mean: 18.50, start_sd: 0.50, duration_min: 45,  kw: 2.00}}
      water_pump:   {own: 0.30, critical: false, flex: defer,    session: {start_mean: 18.00, start_sd: 0.50, duration_min: 30,  kw: 0.75}}
      ev_charger:   {own: 0.08, critical: false, flex: defer,    session: {start_mean: 20.00, start_sd: 0.50, duration_min: 180, kw: 1.50}}

scenarios:
  peri_urban_low_income:
    label: CALIBRATED TO REAL DATA
    description: >
      A peri-urban DT on the edge of a mid-sized Uttar Pradesh town. Mostly low-income
      homes; baseline outages calibrated to ESMI "other municipal area" locations.
    num_homes: 250
    transformer_kva: 100
    segment_mix: {low_income: 0.70, middle: 0.25, affluent: 0.05}
    esmi_category: other_municipal
    opted_out_homes: 2
  mixed_urban:
    label: CALIBRATED TO REAL DATA
    description: >
      A mixed-income urban DT in Lucknow; baseline outages calibrated to ESMI megacity
      locations.
    num_homes: 200
    transformer_kva: 100
    segment_mix: {low_income: 0.40, middle: 0.45, affluent: 0.15}
    esmi_category: megacity
    opted_out_homes: 2
  evening_peak_legacy:
    label: SIMULATED
    description: >
      The original prototype's 60-home evening case on a 100 kVA DT, kept to show the
      effect of the accounting fixes. Magnitudes are not calibrated to Indian data.
    num_homes: 60
    segment_mix: {legacy: 1.0}
    opted_out_homes: 1
